<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TC Robotics 사이트 간편 편집기</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--line:#dfe3e8;--text:#171a1f;--sub:#68707a;--accent:#111;--good:#0f7b47;--warn:#a85b00}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}.top-inner{max-width:1180px;margin:auto;padding:14px 20px;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand b{display:block;font-size:1.05rem}.brand span{font-size:.78rem;color:var(--sub)}.actions{display:flex;flex-wrap:wrap;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.btn.primary{background:#111;color:#fff;border-color:#111}.wrap{max-width:1180px;margin:22px auto;padding:0 20px 60px}.guide{background:#111;color:#fff;border-radius:16px;padding:20px 22px;line-height:1.7;margin-bottom:18px}.guide strong{color:#ffd46a}.grid{display:grid;grid-template-columns:260px 1fr;gap:18px}.side,.panel{background:#fff;border:1px solid var(--line);border-radius:16px}.side{padding:14px;height:max-content;position:sticky;top:88px}.side button{width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:9px;font-weight:800;cursor:pointer}.side button.active{background:#111;color:#fff}.panel{padding:22px}.panel h2{margin:0 0 6px}.desc{margin:0 0 18px;color:var(--sub);line-height:1.6}.row{display:grid;grid-template-columns:220px 1fr;gap:14px;padding:14px 0;border-top:1px solid #edf0f2}.row:first-of-type{border-top:0}.label b{display:block}.label small{display:block;color:var(--sub);margin-top:4px;word-break:break-all}.control input[type=text],.control input[type=url],.control textarea,.control select{width:100%;border:1px solid #ccd2d8;border-radius:9px;padding:10px 11px;background:#fff}.control textarea{min-height:86px;resize:vertical;line-height:1.55}.langbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:13px;background:#f7f8fa;border-radius:12px}.langbar select{padding:9px 12px;border:1px solid #ccd2d8;border-radius:9px}.hint{font-size:.78rem;color:var(--sub);margin-top:6px;line-height:1.5}.media-item{border-top:1px solid #edf0f2;padding:16px 0}.media-item:first-child{border-top:0}.media-grid{display:grid;grid-template-columns:180px 1fr;gap:16px}.preview{height:120px;border:1px dashed #bbc2c9;border-radius:10px;background:#f8f9fa;display:grid;place-items:center;overflow:hidden;color:#8a929b;font-size:.8rem;text-align:center}.preview img{width:100%;height:100%;object-fit:cover}.fileline{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.fileline input[type=file]{max-width:100%}.status{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:12px 16px;border-radius:11px;box-shadow:0 10px 30px #0003;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.status.show{opacity:1;transform:none}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eaf7f0;color:var(--good);font-size:.75rem;font-weight:800}.warn{color:var(--warn)}@media(max-width:820px){.grid{grid-template-columns:1fr}.side{position:static;display:flex;gap:6px;overflow:auto}.side button{width:auto;white-space:nowrap}.row,.media-grid{grid-template-columns:1fr}.top-inner{align-items:flex-start;flex-direction:column}.panel{padding:17px}}
</style>
</head>
<body>
<div class="top"><div class="top-inner"><div class="brand"><b>TC Robotics 사이트 간편 편집기</b><span>코드를 직접 찾지 않고 글·사진을 바꾸는 도구</span></div><div class="actions"><button class="btn" id="openSite">사이트 보기</button><button class="btn primary" id="downloadData">수정 파일 다운로드</button></div></div></div>
<div class="wrap">
  <div class="guide"><strong>가장 쉬운 사용법</strong><br>① 왼쪽 메뉴에서 글이나 이미지를 수정합니다. ② 맨 위의 <b>수정 파일 다운로드</b>를 누릅니다. ③ 내려받은 <b>site-data.js</b> 하나만 기존 파일과 교체하면 끝입니다.<br><span style="color:#cbd1d8">이미지는 파일을 선택하면 자동으로 크기를 줄여 site-data.js 안에 넣기 때문에 assets 폴더를 직접 건드리지 않아도 됩니다.</span></div>
  <div class="grid">
    <aside class="side" id="menu"></aside>
    <section class="panel">
      <div id="langBar" class="langbar"><b>편집 언어</b><select id="editLang"><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="ru">Русский</option><option value="hi">हिन्दी</option><option value="bg">Български</option></select><span class="badge">6개 언어</span><span class="hint">※ 한국어 내용을 바꿔도 다른 언어가 자동 번역되지는 않습니다.</span></div>
      <div id="content"></div>
    </section>
  </div>
</div>
<div class="status" id="status"></div>
<script src="site-data.js"></script>
<script>
const data={config:JSON.parse(JSON.stringify(SITE_CONFIG)),text:JSON.parse(JSON.stringify(SITE_TEXT))};
const SECTIONS={
 general:{name:'기본 정보',keys:['topline','clubName','schoolName','navHome','navAbout','navActivity','navMedia','navJoin','footerText']},
 home:{name:'홈 화면',keys:['heroKicker','heroTitle','heroLead','heroAbout','heroJoin','mini1Title','mini1Text','mini2Title','mini2Text','mini3Title','mini3Text','mediaHeroLabel','seasonLabel','seasonTitle','seasonText','strip1Label','strip2Label','strip3Label','strip4Label','strip4Value','homeKicker','homeTitle','homeCopy','homeCard1Title','homeCard1Text','homeCard2Title','homeCard2Text','homeCard3Title','homeCard3Text','more']},
 about:{name:'동아리 소개',keys:['aboutKicker','aboutTitle','aboutLead','aboutCard1Title','aboutCard1Text','aboutCard2Title','aboutCard2Text','aboutCard3Title','aboutCard3Text','aboutCard4Title','aboutCard4Text','aboutFeatureKicker','aboutFeatureTitle','aboutFeatureText','joinButton']},
 activity:{name:'활동 · 대회',keys:['activityKicker','activityTitle','activityLead','step1Title','step1Text','step2Title','step2Text','step3Title','step3Text','step4Title','step4Text','step5Title','step5Text','competitionKicker','competitionTitle','competitionText','mediaButton']},
 media:{name:'사진 · 영상 문구',keys:['mediaKicker','mediaTitle','mediaLead','tabPhotos','tabVideos','tabCode','videoKicker','videoTitle','videoText','codeKicker','codeTitle','codeText']},
 join:{name:'지원 안내',keys:['joinKicker','joinTitle','joinLead','recruiting','joinHeadline','joinText','apply','recruitInfo','targetLabel','targetValue','dateLabel','dateValue','placeLabel','placeValue','contactLabel','contactValue','joinNotice']},
 images:{name:'이미지 · 영상',special:'images'},
 settings:{name:'링크 설정',special:'settings'}
};
const LABELS={topline:'상단 한줄',clubName:'동아리 이름',schoolName:'학교 이름',navHome:'메뉴 - 홈',navAbout:'메뉴 - 소개',navActivity:'메뉴 - 활동',navMedia:'메뉴 - 미디어',navJoin:'메뉴 - 지원',footerText:'푸터 문구',heroKicker:'홈 상단 작은 제목',heroTitle:'홈 메인 제목',heroLead:'홈 소개 문장',heroAbout:'소개 버튼',heroJoin:'지원 버튼',mini1Title:'미니 1 제목',mini1Text:'미니 1 설명',mini2Title:'미니 2 제목',mini2Text:'미니 2 설명',mini3Title:'미니 3 제목',mini3Text:'미니 3 설명',mediaHeroLabel:'대표 미디어 라벨',seasonLabel:'시즌 라벨',seasonTitle:'시즌 제목',seasonText:'시즌 설명',homeKicker:'홈 섹션 작은 제목',homeTitle:'홈 섹션 제목',homeCopy:'홈 섹션 설명',homeCard1Title:'홈 카드 1 제목',homeCard1Text:'홈 카드 1 설명',homeCard2Title:'홈 카드 2 제목',homeCard2Text:'홈 카드 2 설명',homeCard3Title:'홈 카드 3 제목',homeCard3Text:'홈 카드 3 설명',more:'자세히 보기 버튼',aboutKicker:'소개 작은 제목',aboutTitle:'소개 메인 제목',aboutLead:'소개 설명',aboutCard1Title:'소개 카드 1 제목',aboutCard1Text:'소개 카드 1 설명',aboutCard2Title:'소개 카드 2 제목',aboutCard2Text:'소개 카드 2 설명',aboutCard3Title:'소개 카드 3 제목',aboutCard3Text:'소개 카드 3 설명',aboutCard4Title:'소개 카드 4 제목',aboutCard4Text:'소개 카드 4 설명',aboutFeatureKicker:'신입부원 작은 제목',aboutFeatureTitle:'신입부원 제목',aboutFeatureText:'신입부원 설명',joinButton:'지원 안내 버튼',activityKicker:'활동 작은 제목',activityTitle:'활동 메인 제목',activityLead:'활동 설명',step1Title:'1단계 제목',step1Text:'1단계 설명',step2Title:'2단계 제목',step2Text:'2단계 설명',step3Title:'3단계 제목',step3Text:'3단계 설명',step4Title:'4단계 제목',step4Text:'4단계 설명',step5Title:'5단계 제목',step5Text:'5단계 설명',competitionKicker:'대회 기록 작은 제목',competitionTitle:'대회/시즌 이름',competitionText:'대회 설명',mediaButton:'미디어 버튼',mediaKicker:'미디어 작은 제목',mediaTitle:'미디어 메인 제목',mediaLead:'미디어 설명',tabPhotos:'사진 탭',tabVideos:'영상 탭',tabCode:'코드 탭',videoKicker:'영상 작은 제목',videoTitle:'영상 제목',videoText:'영상 설명',codeKicker:'코드 작은 제목',codeTitle:'코드 제목',codeText:'코드 설명',joinKicker:'지원 작은 제목',joinTitle:'지원 메인 제목',joinLead:'지원 설명',recruiting:'모집 라벨',joinHeadline:'모집 카드 제목',joinText:'모집 카드 설명',apply:'지원 버튼',recruitInfo:'모집 정보 제목',targetLabel:'모집 대상 라벨',targetValue:'모집 대상',dateLabel:'기간 라벨',dateValue:'모집 기간',placeLabel:'장소 라벨',placeValue:'활동 장소',contactLabel:'문의 라벨',contactValue:'문의 방법',joinNotice:'지원 안내문',strip1Label:'정보 라벨 1',strip2Label:'정보 라벨 2',strip3Label:'정보 라벨 3',strip4Label:'정보 라벨 4',strip4Value:'활동 분야'};
let section='general';let lang='ko';
function friendly(v){return String(v??'').replaceAll('<br>','\n').replaceAll('<em>','[강조]').replaceAll('</em>','[/강조]')}
function encoded(v){return String(v).replaceAll('[강조]','<em>').replaceAll('[/강조]','</em>').replace(/\r?\n/g,'<br>')}
function toast(msg){const s=document.getElementById('status');s.textContent=msg;s.classList.add('show');setTimeout(()=>s.classList.remove('show'),2200)}
function menu(){const m=document.getElementById('menu');m.innerHTML='';Object.entries(SECTIONS).forEach(([id,s])=>{const b=document.createElement('button');b.textContent=s.name;b.className=id===section?'active':'';b.onclick=()=>{section=id;menu();render()};m.appendChild(b)})}
function render(){const box=document.getElementById('content'),s=SECTIONS[section];document.getElementById('langBar').style.display=s.special?'none':'flex';if(s.special==='images')return renderImages(box);if(s.special==='settings')return renderSettings(box);box.innerHTML=`<h2>${s.name}</h2><p class="desc">화면에서 보이는 문구를 바로 수정하세요. 제목에서 줄을 바꾸고 싶으면 엔터를 누르세요. <b>[강조]내용[/강조]</b>으로 쓰면 홈 메인 제목의 강조 효과를 유지할 수 있습니다.</p>`;s.keys.forEach(k=>{const value=friendly(data.text[lang][k]);const long=value.length>48||value.includes('\n');const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="label"><b>${LABELS[k]||k}</b><small>${k}</small></div><div class="control"></div>`;const el=document.createElement(long?'textarea':'input');if(!long)el.type='text';el.value=value;el.oninput=()=>data.text[lang][k]=encoded(el.value);row.querySelector('.control').appendChild(el);box.appendChild(row)})}
const MEDIA_LABELS={logo:'로고',heroImage:'홈 대표 이미지',aboutImage:'동아리 소개 이미지',activityImage:'활동/대회 이미지',gallery1:'갤러리 1',gallery2:'갤러리 2',gallery3:'갤러리 3',gallery4:'갤러리 4',gallery5:'갤러리 5'};
function getMedia(k){return k==='logo'?data.config.logo:data.config.media[k]}
function setMedia(k,v){if(k==='logo')data.config.logo=v;else data.config.media[k]=v}
function renderImages(box){box.innerHTML='<h2>이미지 · 영상</h2><p class="desc">사진은 <b>파일 선택</b>만 하면 됩니다. 자동으로 최대 1600px 정도로 줄여서 site-data.js 안에 저장하므로 이미지 폴더에 따로 복사할 필요가 없습니다. <span class="warn">아주 많은 고화질 사진을 넣으면 파일이 커질 수 있습니다.</span></p>';Object.keys(MEDIA_LABELS).forEach(k=>{const item=document.createElement('div');item.className='media-item';const val=getMedia(k)||'';item.innerHTML=`<div class="media-grid"><div class="preview">${val?`<img src="${val}" alt="">`:'이미지 없음'}</div><div><b>${MEDIA_LABELS[k]}</b><div class="hint">직접 경로를 입력해도 되고, 아래 파일 선택을 사용해도 됩니다.</div><div class="control" style="margin-top:8px"><input type="text" value="${String(val).startsWith('data:')?'[이미지 파일이 내부 저장됨]':val}" placeholder="assets/images/photo.jpg"></div><div class="fileline"><input type="file" accept="image/*"><button class="btn" type="button">이미지 비우기</button></div></div></div>`;const path=item.querySelector('input[type=text]'),file=item.querySelector('input[type=file]'),clear=item.querySelector('button');path.onchange=()=>{if(path.value!=='[이미지 파일이 내부 저장됨]'){setMedia(k,path.value.trim());renderImages(box)}};file.onchange=async()=>{if(!file.files[0])return;toast('이미지를 처리하는 중...');const uri=await compressImage(file.files[0]);setMedia(k,uri);renderImages(box);toast('이미지가 들어갔습니다')};clear.onclick=()=>{setMedia(k,'');renderImages(box)};box.appendChild(item)});const vids=document.createElement('div');vids.className='media-item';vids.innerHTML=`<h3>영상 파일</h3><p class="hint">동영상은 용량이 커서 자동 삽입하지 않습니다. assets/videos 폴더에 MP4를 넣고 아래 경로만 적는 방식을 권장합니다.</p><div class="row"><div class="label"><b>홈 대표 영상</b><small>heroVideo</small></div><div class="control"><input type="text" id="heroVideoPath" value="${data.config.media.heroVideo||''}" placeholder="assets/videos/hero.mp4"></div></div><div class="row"><div class="label"><b>미디어 페이지 영상</b><small>mediaVideo</small></div><div class="control"><input type="text" id="mediaVideoPath" value="${data.config.media.mediaVideo||''}" placeholder="assets/videos/match.mp4"></div></div>`;box.appendChild(vids);vids.querySelector('#heroVideoPath').oninput=e=>data.config.media.heroVideo=e.target.value.trim();vids.querySelector('#mediaVideoPath').oninput=e=>data.config.media.mediaVideo=e.target.value.trim()}
function renderSettings(box){box.innerHTML=`<h2>링크 설정</h2><p class="desc">지원 버튼이 연결될 주소만 입력하면 됩니다.</p><div class="row"><div class="label"><b>지원 폼 주소</b><small>applyUrl</small></div><div class="control"><input type="url" id="applyUrlEdit" value="${data.config.applyUrl||''}" placeholder="https://forms.gle/..."><div class="hint">구글폼, 네이버폼 등 실제 지원 페이지 주소</div></div></div>`;box.querySelector('#applyUrlEdit').oninput=e=>data.config.applyUrl=e.target.value.trim()}
function compressImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);let uri;try{uri=c.toDataURL('image/webp',.86)}catch(e){uri=r.result}resolve(uri)};img.onerror=()=>resolve(r.result);img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function makeData(){return `/* TC Robotics site-data.js - EDIT_HERE.html에서 생성 */\nconst SITE_CONFIG = ${JSON.stringify(data.config,null,2)};\n\nconst SITE_TEXT = ${JSON.stringify(data.text,null,2)};\n`}
document.getElementById('editLang').onchange=e=>{lang=e.target.value;render()};document.getElementById('downloadData').onclick=()=>{const blob=new Blob([makeData()],{type:'text/javascript;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='site-data.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('site-data.js를 다운로드했습니다')};document.getElementById('openSite').onclick=()=>window.open('index.html','_blank');menu();render();
</script>
</body></html>
